name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Smoke
        run: |
          ./pixel-forge --op threshold --threshold 128 --in samples/checker.ppm --out /tmp/threshold.ppm
          test -f /tmp/threshold.ppm
